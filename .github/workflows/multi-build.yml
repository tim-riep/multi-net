# Builds and pushes the images for a "<release>-multi" tag to GHCR:
#   ghcr.io/<owner>/multi-proxy:<tag>  and  ghcr.io/<owner>/mgmt-mux:<tag>
# Runs on tag push (created by multi-sync.yml) or manually for any ref.
name: multi - build images

on:
  push:
    tags:
      - "v*-multi"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (e.g. v0.82.0-multi)"
        required: true
      latest:
        description: "Also tag as latest"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: multi-proxy
            context: .
            file: multi/docker/proxy.Dockerfile
          - image: mgmt-mux
            context: multi/mux
            file: multi/mux/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Image tags
        id: meta
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          LATEST: ${{ github.event_name == 'push' || inputs.latest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(echo "$REF" | tr '/' '-')
          name="ghcr.io/${OWNER,,}/${{ matrix.image }}"
          tags="$name:$version"
          if [ "$LATEST" = "true" ]; then tags="$tags,$name:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
